<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Throne of Shadows Remaster</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- CLASS SELECT -->
<section id="view-class" class="view">
  <div class="class-wrap">
    <h1 class="game-title">THRONE OF SHADOWS</h1>
    <div class="game-subtitle">REMASTER</div>
    <p class="choose-label">CHOOSE YOUR CLASS</p>
    <div id="class-cards" class="class-cards"></div>
    <input id="hero-name" placeholder="Hero name" maxlength="16" autocomplete="off">
    <button id="start-btn" class="btn gold big">BEGIN ADVENTURE</button>
  </div>
</section>

<!-- GAME -->
<section id="view-game" class="view hidden">
  <header class="game-header">
    <div class="hero-info">
      <span id="hud-emoji" class="hud-emoji">🛡️</span>
      <div>
        <div id="hud-name" class="hud-name">Hero</div>
        <div id="hud-level" class="hud-level">Lv 1</div>
      </div>
    </div>
    <div class="hud-currencies">
      <span>💰 <b id="hud-gold">0</b></span>
      <span>🗺️ <b id="hud-stage">1</b></span>
    </div>
  </header>

  <div class="hp-bar"><div id="hero-hp-fill" class="hp-fill"></div><span id="hero-hp-text" class="bar-text"></span></div>
  <div class="mana-bar"><div id="hero-mana-fill" class="mana-fill"></div><span id="hero-mana-text" class="bar-text"></span></div>
  <div class="xp-bar"><div id="hero-xp-fill" class="xp-fill"></div></div>

  <main class="battle-area" id="battle-area">
    <div id="enemy-emoji" class="enemy-emoji">🐺</div>
    <div id="enemy-name" class="enemy-name">Dire Wolf</div>
    <div id="boss-badge" class="boss-badge hidden">👹 BOSS</div>
    <div class="hp-bar enemy-hp"><div id="enemy-hp-fill" class="hp-fill enemy-fill"></div><span id="enemy-hp-text" class="bar-text"></span></div>
    <div id="float-layer" class="float-layer"></div>
  </main>

  <div id="spell-bar" class="spell-bar"></div>
  <button id="attack-btn" class="attack-btn">⚔️<span>TAP TO ATTACK</span></button>
  <div id="pet-bar" class="pet-bar hidden">
    <span id="pet-emoji">🐺</span>
    <span id="pet-loyalty"></span>
    <div id="food-btns" class="food-btns"></div>
  </div>

  <div id="loot-toast" class="loot-toast hidden"></div>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="battle">⚔️<span>Battle</span></button>
    <button class="tab-btn" data-tab="party">👥<span>Party</span></button>
    <button class="tab-btn" data-tab="dungeon">🗺️<span>Dungeon</span></button>
    <button class="tab-btn" data-tab="character">👤<span>Hero</span></button>
    <button class="tab-btn" data-tab="gear">🎒<span>Gear</span></button>
    <button class="tab-btn" data-tab="settings">⚙️<span>Settings</span></button>
  </nav>

  <section id="tab-battle" class="tab active"></section>

  <section id="tab-character" class="tab hidden">
    <h2>👤 <span id="char-name">Hero</span></h2>
    <div id="char-stats" class="stat-grid"></div>
    <h3>Equipped</h3>
    <div id="equipped-list" class="gear-list"></div>
  </section>

  <section id="tab-gear" class="tab hidden">
    <h2>🎒 Inventory</h2>
    <div id="inventory-list" class="gear-list"></div>
  </section>

  <section id="tab-party" class="tab hidden">
    <h2>👥 Party <span id="party-count" class="muted"></span></h2>
    <p class="muted small">5-man: 1 Tank 🛡️ · 1 Healer 💚 · 3 DPS ⚔️</p>
    <div id="party-list" class="gear-list"></div>
    <h3>🍺 Recruit Companions</h3>
    <div id="recruit-list" class="gear-list"></div>
  </section>

  <section id="tab-dungeon" class="tab hidden">
    <h2>🗺️ Dungeons</h2>
    <p class="muted small">Requires full 5-man party</p>
    <div id="dungeon-list" class="gear-list"></div>
  </section>

  <section id="tab-settings" class="tab hidden">
    <h2>⚙️ Settings</h2>
    <button id="logout-btn" class="btn">Log Out</button>
  </section>
</section>

<script type="module" src="js/game.js"></script>
</body>
</html>
